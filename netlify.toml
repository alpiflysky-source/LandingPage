# Configurazione Netlify (deploy collegato a GitHub)
[build]
  # Il sito si trova in questa cartella: Netlify pubblica solo il suo contenuto
  publish = "fairdrones-redesign"
  command = ""

# Area riservata (demo, app del rifugio, login): l'applicazione gira su Render.
# Per cambiare indirizzo (es. https://app.fairdrones.it/demo/) si modifica solo la riga "to".
# 302 e non 301: il browser non deve ricordarsi la destinazione.
[[redirects]]
  from = "/area-riservata"
  to = "https://fairdrones-demo.onrender.com/demo/"
  status = 302
  force = true
